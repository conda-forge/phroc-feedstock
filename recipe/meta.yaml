{% set name = "phroc" %}
{% set version = "0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/phroc-{{ version }}.tar.gz
  sha256: 3923ecb6c673e4d65610eb8704ad7216805d0a989afba26817a72db8fc15c655

build:
  entry_points:
    - phroc = phroc:phroc_run
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python 3.10
    - setuptools
    - pip
  run:
    - python >=3.10
    - numpy
    - pandas
    - pyside6
    - matplotlib-base
    - pyarrow
    - openpyxl

test:
  imports:
    - phroc
  commands:
    - pip check
  requires:
    - pip
    - python 3.10

about:
  summary: GUI for processing spectrophotometric pH data
  license: GPL-3.0-only
  license_file: LICENSE
  home: https://github.com/mvdh7/phroc

extra:
  recipe-maintainers:
    - mvdh7
